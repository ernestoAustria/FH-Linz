<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b39"><title>FH Linz · Leadership Learning Hub</title><style>body{margin:0;background:#f4f6f7;color:#19303d;font:16px system-ui}header{background:#102b39;color:white;padding:28px 20px}main{max-width:900px;margin:auto;padding:18px}h1{margin:5px 0}button,input{font:inherit;border:1px solid #ccd5d9;border-radius:12px;padding:12px}button{cursor:pointer;background:white}button.active{background:#0f6473;color:white}nav{display:flex;gap:8px;overflow:auto;padding:12px 0}article{background:white;border-radius:16px;padding:22px;margin:14px 0;box-shadow:0 3px 15px #0001}p{line-height:1.65}.small{color:#60717a}.card{display:flex;justify-content:space-between;gap:12px;align-items:center}#search{width:calc(100% - 26px)}.answer{display:block;width:100%;text-align:left;margin:7px 0}.correct{background:#d9f2e5}.wrong{background:#fbe3e3}blockquote{border-left:4px solid #e8a83d;padding:12px;background:#fff7e8;margin-left:0}</style></head><body><header><div class="small" style="color:#b5d9df">FACHHOCHSCHULE LINZ · LEADERSHIP</div><h1>Leadership Learning Hub</h1><div>Führung verstehen. Dynamiken erkennen. Den Unterschied machen.</div></header><main><input id="search" placeholder="Lerninhalte durchsuchen …" aria-label="Suche"><nav><button onclick="view='all';render()">Alle Themen</button><button onclick="view='favorites';render()">★ Favoriten</button><button onclick="view='quiz';render()">Quiz</button></nav><div id="app"></div></main><script>
const topics=[
["Zielbild von Führung","Gute Führung schafft Orientierung, Sicherheit und Zusammenarbeit. Das Ziel: Menschen sollen rückblickend sagen können, dass die Zusammenarbeit bereichernd war.","Welche Wirkung möchte ich als Führungskraft auf andere haben?"],
["Karriere durch Problemlösung","Denke nicht nur an den nächsten Job, sondern an den übernächsten. Sichtbarkeit entsteht, wenn du Probleme löst, die für die Organisation wichtig sind.","Welches ungelöste Problem kann ich heute angehen?"],
["Hinter jedem Verhalten steckt ein Bedürfnis","Widerstand, Rückzug oder Störungen können unerfüllte Bedürfnisse ausdrücken. Beobachte das Verhalten, setze Grenzen und versuche, die Hintergründe zu verstehen.","Welches Bedürfnis könnte hinter dem Verhalten stehen?"],
["Übe Führung, bevor du führen musst","Beobachten. Ausprobieren. Reflektieren. Wiederholen. Wer erst in der Krise beginnt, Konflikte anzusprechen und Verantwortung zu übernehmen, ist oft spät dran.","Was kann ich diese Woche bewusst üben?"],
["Üben, wenn nichts auf dem Spiel steht","Im Alltag auf Respektlosigkeit, Ausgrenzung und Ungerechtigkeit achten. Nicht immer kämpfen müssen – aber wahrnehmen und Position beziehen.","Wo kann ich heute den Unterschied machen?"],
["Leadership ist Verhalten","Situationen wahrnehmen, Gruppendynamiken erkennen, Verantwortung übernehmen, Grenzen setzen, Menschen einbinden und auch in schwierigen Situationen handlungsfähig bleiben.","Was tue ich konkret statt mich auf Titel oder Macht zu verlassen?"],
["Statusspiele erkennen","Status ist dynamisch: Wer hat gerade die Oberhand? Statuskonflikte können eine Gruppe blockieren. Führung heißt, klare Grenzen ohne Demütigung zu setzen.","Wie kann ich meinen Standpunkt ruhig und klar vertreten?"],
["WWW-Methode","Wahrnehmung, Wirkung und Wunsch: Beschreibe konkretes Verhalten, seine Wirkung und die gewünschte Veränderung.","Wie formuliere ich meine Rückmeldung ohne persönliche Abwertung?"],
["Gruppendynamik und Rollen","Gruppen brauchen Orientierung. Formale Rollen und tatsächliche Funktionen können auseinanderfallen. Auch Gegenpositionen erfüllen manchmal eine Gruppenfunktion.","Welche informellen Rollen beobachte ich im Team?"],
["Teamphasen","Forming, Storming, Norming und Performing beschreiben typische Entwicklungsphasen. Führung muss sich an die jeweilige Situation anpassen.","Welche Unterstützung braucht mein Team gerade?"],
["Fünf Dysfunktionen eines Teams","Fehlendes Vertrauen, Konfliktscheu, mangelndes Commitment, Vermeidung von Verantwortung und fehlende Ergebnisorientierung können Teamleistung schwächen.","Welche Dysfunktion ist bei uns besonders sichtbar?"],
["Grenzen setzen","Eine rote Linie benennen, Verhalten konkret ansprechen, eine angemessene Konsequenz erklären und faire Anhörung ermöglichen. Sachlich bleiben, nicht persönlich verletzen.","Welche Grenze muss ich klarer formulieren?"],
["Konflikte und schwierige Gespräche","Konflikte früh ansprechen, Interessen hinter Positionen erkennen und zwischen Verhalten und Person unterscheiden.","Welche Interessen liegen hinter den Forderungen?"],
["Situative Führung","Führungsverhalten auf Aufgabe, Kompetenz, Motivation und Kontext abstimmen. Kein Stil ist in jeder Situation richtig.","Wie viel Orientierung und Autonomie braucht die Person?"],
["Transaktionale und transformationale Führung","Transaktionale Führung arbeitet mit Zielen, Leistung und Anreizen; transformationale Führung mit Vision, Sinn und Veränderung.","Wann brauche ich klare Ziele, wann Inspiration?"],
["Partizipative und agile Führung","Mitarbeitende beteiligen, Verantwortung verteilen, Feedback nutzen und Experimente ermöglichen.","Welche Entscheidung kann das Team selbst treffen?"],
["Berechtigtes Interesse finden","Bei blockierten Veränderungen fragen: Wer hat ein nachvollziehbares Interesse daran, dass dieses Problem gelöst wird? Lösungen statt Schuldzuweisungen anbieten.","Wer profitiert von einer nachhaltigen Lösung?"],
["Schlüsselpersonen und Nachfolge","Abhängigkeiten von einzelnen Personen sind organisatorische Risiken. Wissen teilen und rechtzeitig Alternativen aufbauen.","Was wäre unser Plan B bei einem plötzlichen Ausfall?"],
["Vorbereitung und Gelegenheit","Bereitschaft entsteht durch wiederholte Übung. Nutze kleine Gelegenheiten, um für größere Verantwortung vorbereitet zu sein.","Wofür möchte ich schon jetzt bereit sein?"],
["Wertschätzung und Verantwortung","Wertschätzung gilt der Person und der gesamten Gruppe. Fehlverhalten ansprechen, ohne Menschen bloßzustellen.","Wie schütze ich die Gruppe und bleibe fair?"],
["Führungsstile 1960–2025","Autoritär, transaktional, transformational, situativ, partizipativ sowie agil und Servant Leadership sind unterschiedliche Denkansätze; sie ersetzen einander nicht strikt chronologisch.","Welche Elemente sind in meiner Situation hilfreich?"],
["Den Unterschied machen","Nicht Titel, Organigramm oder Macht entscheiden allein über Führung, sondern wahrnehmbares Verhalten und der Mut, Verantwortung zu übernehmen.","Welchen Unterschied habe ich heute gemacht?"]
];
let view='all',query='',favorites=new Set(JSON.parse(localStorage.getItem('fh-favorites')||'[]')),score=0,answered={};document.getElementById('search').oninput=e=>{query=e.target.value.toLowerCase();render()};
function fav(i){favorites.has(i)?favorites.delete(i):favorites.add(i);localStorage.setItem('fh-favorites',JSON.stringify([...favorites]));render()}
function render(){let app=document.getElementById('app');if(view==='quiz'){app.innerHTML='<h2>Wissenscheck</h2>'+topics.slice(0,12).map((t,i)=>'<article><div class="small">Frage '+(i+1)+'</div><h3>'+t[0]+'</h3><p>Welche Aussage passt zum Lerninhalt?</p>'+[t[1],'Führung bedeutet vor allem, einen höheren Titel zu besitzen.','Probleme sollten grundsätzlich ignoriert werden.'].map((a,j)=>'<button class="answer '+(answered[i]===j?(j===0?'correct':'wrong'):'')+'" onclick="answer('+i+','+j+')">'+String.fromCharCode(65+j)+': '+a+'</button>').join('')+(answered[i]!==undefined?'<p><strong>'+(answered[i]===0?'Richtig!':'Nicht ganz.')+'</strong> '+t[2]+'</p>':'')+'</article>').join('');return}let list=topics.map((t,i)=>({t,i})).filter(x=>(view!=='favorites'||favorites.has(x.i))&&x.t.join(' ').toLowerCase().includes(query));app.innerHTML='<p class="small">'+list.length+' Themen · Favoriten werden auf diesem Gerät gespeichert</p>'+list.map(({t,i})=>'<article><div class="card"><h2>'+t[0]+'</h2><button aria-label="Favorit" onclick="fav('+i+')">'+(favorites.has(i)?'★':'☆')+'</button></div><p>'+t[1]+'</p><blockquote>'+t[2]+'</blockquote><label class="small">Meine Notiz</label><textarea style="width:100%;box-sizing:border-box;min-height:65px;border:1px solid #ddd;border-radius:10px;padding:10px" oninput="localStorage.setItem(\'fh-note-'+i+'\',this.value)">'+(localStorage.getItem('fh-note-'+i)||'')+'</textarea></article>').join('')}
function answer(i,j){answered[i]=j;render()}render();
</script></body></html>
